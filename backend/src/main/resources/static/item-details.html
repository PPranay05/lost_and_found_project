<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details - Lost & Found Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🔍</div>
        <span>Lost & Found Portal</span>
      </a>
      <div class="nav-links" id="nav-links-area"></div>
      <div id="user-nav-area"></div>
    </div>
  </nav>

  <main class="main-content" style="max-width:900px;">
    <div id="details-container">Loading item details...</div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const itemType = urlParams.get('type') || 'found';
    const itemId = urlParams.get('id');

    async function loadItemDetails() {
      if (!itemId) {
        document.getElementById('details-container').innerHTML = '<div class="card" style="text-align:center;">No item ID provided.</div>';
        return;
      }

      try {
        const endpoint = itemType === 'lost' ? `/lost-items/${itemId}` : `/found-items/${itemId}`;
        const item = await fetchApi(endpoint);

        const container = document.getElementById('details-container');

        let qrSection = '';
        if (itemType === 'found' && item.qrCodeImageBase64) {
          qrSection = `
            <div class="card" style="margin-top:1.5rem; text-align:center; padding:1.5rem;">
              <h4>Associated Security QR Code</h4>
              <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">Scan this QR code during claiming for verification</p>
              <img src="${item.qrCodeImageBase64}" style="width:180px; height:180px; border-radius:12px; background:#fff; padding:10px; margin-bottom:1rem;" />
              <div style="font-size:0.8rem; color:var(--text-subtle); margin-bottom:1rem;">QR ID: ${item.qrCodeId || 'N/A'}</div>
              <a href="/api/qr/image/${item.id}" class="btn btn-sm btn-secondary" download>Download QR PNG Image</a>
            </div>
          `;
        }

        const claimBtn = itemType === 'found' && (item.status === 'REPORTED' || item.status === 'MATCHED') ?
          `<a href="claim-item.html?foundId=${item.id}" class="btn btn-primary">✋ Submit Ownership Claim</a>` : '';

        container.innerHTML = `
          <div class="card" style="padding:2.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
              <div>
                <span class="badge ${itemType === 'lost' ? 'badge-type-lost' : 'badge-type-found'}">${itemType.toUpperCase()} ITEM</span>
                <h1 style="margin-top:0.35rem;">${escapeHtml(item.itemName)}</h1>
                <div style="font-size:0.9rem; color:var(--text-muted);">Unique ID: <code>${item.lostItemIdCode || item.foundItemIdCode}</code></div>
              </div>
              <div>${getStatusBadge(item.status)}</div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2rem; margin-bottom:1.5rem;">
              <div>
                <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500&auto=format&fit=crop&q=60'}" style="width:100%; height:260px; object-fit:cover; border-radius:12px; border:1px solid var(--border-color);" />
              </div>
              <div style="display:flex; flex-direction:column; gap:0.75rem;">
                <div><strong>Category:</strong> ${escapeHtml(item.category)}</div>
                <div><strong>Location ${itemType === 'lost' ? 'Lost' : 'Found'}:</strong> ${escapeHtml(item.locationLost || item.locationFound)}</div>
                <div><strong>Date ${itemType === 'lost' ? 'Lost' : 'Found'}:</strong> ${item.dateLost || item.dateFound}</div>
                <div><strong>Time:</strong> ${item.timeLost || item.timeFound || 'Not specified'}</div>
                <div><strong>Color:</strong> ${escapeHtml(item.color || 'N/A')}</div>
                <div><strong>Brand:</strong> ${escapeHtml(item.brand || 'N/A')}</div>
                <div><strong>Characteristics:</strong> ${escapeHtml(item.characteristics || 'None')}</div>
              </div>
            </div>

            <div style="border-top:1px solid var(--border-color); pt-3; margin-top:1rem; padding-top:1.5rem;">
              <h4>Full Description</h4>
              <p style="color:var(--text-muted); margin-top:0.5rem;">${escapeHtml(item.description)}</p>
            </div>

            ${qrSection}

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2rem; border-top:1px solid var(--border-color); padding-top:1.5rem;">
              <a href="search.html" class="btn btn-secondary">← Back to Search</a>
              ${claimBtn}
            </div>
          </div>
        `;
      } catch (err) {}
    }

    document.addEventListener('DOMContentLoaded', loadItemDetails);
  </script>
</body>
</html>
