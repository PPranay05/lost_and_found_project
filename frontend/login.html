<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lost & Found Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🔍</div>
        <span>Lost & Found Portal</span>
      </a>
      <div id="user-nav-area"></div>
    </div>
  </nav>

  <main class="main-content" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
    <div class="card" style="width:100%; max-width:440px; padding:2.5rem;">
      <div style="text-align:center; margin-bottom:2rem;">
        <h2>Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;" id="login-subtext">Sign in to report, track, or claim items</p>
      </div>

      <!-- Quick Demo Fill Buttons -->
      <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem; justify-content:center;">
        <button type="button" onclick="fillDemo('user')" class="btn btn-sm btn-secondary">Fill User Demo</button>
        <button type="button" onclick="fillDemo('admin')" class="btn btn-sm btn-secondary">Fill Admin Demo</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="name@campus.edu" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••" />
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Sign In</button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);" id="register-link-container">
        Don't have an account? <a id="reg-link" href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    if (redirectUrl) {
      document.getElementById('login-subtext').innerText = 'Please sign in or register to access this page';
      document.getElementById('reg-link').href = `register.html?redirect=${encodeURIComponent(redirectUrl)}`;
    }

    function fillDemo(type) {
      if (type === 'admin') {
        document.getElementById('email').value = 'admin@campus.edu';
        document.getElementById('password').value = 'admin123';
      } else {
        document.getElementById('email').value = 'john@student.edu';
        document.getElementById('password').value = 'user123';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetchApi('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        showToast('Login successful!', 'success');
        setTimeout(() => {
          if (redirectUrl) {
            window.location.href = redirectUrl;
          } else if (res.user.role === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 600);
      } catch (err) {}
    });
  </script>
</body>
</html>
