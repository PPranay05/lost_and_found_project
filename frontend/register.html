<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Lost & Found Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🔍</div>
        <span>Lost & Found Portal</span>
      </a>
      <div id="user-nav-area"></div>
    </div>
  </nav>

  <main class="main-content" style="display:flex; align-items:center; justify-content:center; padding:3rem 1rem;">
    <div class="card" style="width:100%; max-width:560px; padding:2.5rem;">
      <div style="text-align:center; margin-bottom:2rem;">
        <h2>Create an Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;" id="register-subtext">Register to report lost items or register found items</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name *</label>
          <input type="text" id="fullName" class="form-control" required placeholder="Jane Doe" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" required placeholder="jane@campus.edu" />
          </div>
          <div class="form-group">
            <label class="form-label" for="phoneNumber">Phone Number *</label>
            <input type="tel" id="phoneNumber" class="form-control" required placeholder="+1 555-0199" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="studentEmpId">Student / Employee ID *</label>
            <input type="text" id="studentEmpId" class="form-control" required placeholder="STU-12345" />
          </div>
          <div class="form-group">
            <label class="form-label" for="role">User Role *</label>
            <select id="role" class="form-control" required>
              <option value="USER">Student / Employee (USER)</option>
              <option value="ADMIN">Staff / Administrator (ADMIN)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-control" required minlength="6" placeholder="••••••••" />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" class="form-control" required minlength="6" placeholder="••••••••" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Register Account</button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);">
        Already registered? <a id="login-link" href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    if (redirectUrl) {
      document.getElementById('register-subtext').innerText = 'Please create an account to access this page';
      document.getElementById('login-link').href = `login.html?redirect=${encodeURIComponent(redirectUrl)}`;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const studentEmpId = document.getElementById('studentEmpId').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      try {
        const res = await fetchApi('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            fullName, email, phoneNumber, studentEmpId, role, password, confirmPassword
          })
        });

        showToast('Registration successful!', 'success');
        setTimeout(() => {
          if (redirectUrl) {
            window.location.href = redirectUrl;
          } else if (role === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 600);
      } catch (err) {}
    });
  </script>
</body>
</html>
