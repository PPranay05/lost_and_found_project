services:
  - type: web
    name: lost-found-portal
    env: docker
    plan: free
    region: singapore
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lost-found-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lost-found-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lost-found-db
          property: password

databases:
  - name: lost-found-db
    databaseName: lost_found_db
    plan: free
    region: singapore
